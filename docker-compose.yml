services:
  backend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.backend
    image: intentdiff-backend:latest
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${BACKEND_PORT:-8100}:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -e /proc/1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.frontend
    image: intentdiff-frontend:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend

  vllm:
    profiles: ["model"]
    # No restart policy on purpose: a reboot must not silently seize the GPU
    # from whatever else runs on this host.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    # Never 8000: the GPU host already runs production-service there, plus 8080,
    # 8081, 5433, 9400 and 18888. Check `docker ps` before changing this.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${VLLM_PORT:-8101}:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${MODEL:-Qwen/Qwen2.5-Coder-3B-Instruct}
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      - --seed
      - "0"
      # vLLM pre-allocates this fraction of TOTAL GPU memory at startup, not
      # of the free memory. Left at the 0.9 default it will take the card out
      # from under any other GPU container. Size it against what is actually
      # free (`nvidia-smi`) before starting.
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.45}"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
