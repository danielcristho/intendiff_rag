services:
  backend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.backend
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
    image: intentdiff-backend:latest
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${BACKEND_PORT:-8100}:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -e /proc/1"]
      interval: 10s
      timeout: 3s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: ./backend/src
        - action: rebuild
          path: ./backend/Cargo.toml
        - action: rebuild
          path: ./backend/Cargo.lock

  frontend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.frontend
    image: intentdiff-frontend:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./deployments/docker/nginx.conf

  vllm:
    profiles: ["model"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${VLLM_PORT:-8101}:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${MODEL:-Qwen/Qwen2.5-Coder-3B-Instruct}
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      - --seed
      - "0"
      - --generation-config
      - vllm
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.45}"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
