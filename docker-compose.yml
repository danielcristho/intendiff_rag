services:
  backend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.backend
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
    image: intentdiff-backend:latest
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      # Paths and addresses as the container sees them; the rest comes from .env.
      BIND_ADDR: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:?set BACKEND_PORT in .env}
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, e.g. openssl rand -hex 32}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:?set SESSION_TTL_HOURS in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:?set COOKIE_SECURE in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      LOGIN_RATE_BURST: ${LOGIN_RATE_BURST:?set LOGIN_RATE_BURST in .env}
      LOGIN_RATE_REFILL_SECS: ${LOGIN_RATE_REFILL_SECS:?set LOGIN_RATE_REFILL_SECS in .env}
      API_RATE_BURST: ${API_RATE_BURST:?set API_RATE_BURST in .env}
      API_RATE_REFILL_SECS: ${API_RATE_REFILL_SECS:?set API_RATE_REFILL_SECS in .env}
      # nginx sets X-Forwarded-For, so the client IP comes from it.
      TRUST_PROXY: "true"
    ports:
      # Loopback: reaching the API past nginx would let a client forge X-Forwarded-For.
      - "127.0.0.1:${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -e /proc/1"]
      interval: 10s
      timeout: 3s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: ./backend/src
        - action: rebuild
          path: ./backend/Cargo.toml
        - action: rebuild
          path: ./backend/Cargo.lock

  frontend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.frontend
    image: intentdiff-frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${BACKEND_PORT:?set BACKEND_PORT in .env}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./deployments/docker/nginx.conf.template

  vllm:
    profiles: ["model"]
    image: ${VLLM_IMAGE:-vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${VLLM_PORT:-8101}:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${MODEL:-Qwen/Qwen2.5-Coder-3B-Instruct}
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      - --seed
      - "0"
      - --generation-config
      - vllm
      # Cached prefixes make a run's latency depend on what ran before it (D64).
      - --no-enable-prefix-caching
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.45}"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
