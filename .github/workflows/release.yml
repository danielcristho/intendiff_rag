name: release

on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)

          args=(-f tag_name="$TAG")
          [ -n "$prev" ] && args+=(-f previous_tag_name="$prev")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" -q .body > notes.md

          # Most changes land on main without a pull request, so list commits when no PR did.
          range=${prev:+$prev..}$TAG
          if ! grep -q "^## What's Changed" notes.md; then
            { echo "## What's Changed"; git log --no-merges --format='* %s (%h)' "$range"; echo; cat notes.md; } > body.md
            mv body.md notes.md
          fi

          logins=$(git log --no-merges --format=%H "$range" \
            | xargs -I{} gh api "repos/$GITHUB_REPOSITORY/commits/{}" -q '.author.login // empty' \
            | grep -v '\[bot\]$' | sort -u)
          if [ -n "$logins" ]; then
            { echo; echo "## Contributors"; printf '* @%s\n' $logins; } >> notes.md
          fi

          pre=()
          [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]] && pre=(--prerelease)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${pre[@]}"
