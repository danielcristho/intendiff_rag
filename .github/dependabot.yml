version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend:
        patterns: ["*"]
    commit-message:
      prefix: build(backend)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
    commit-message:
      prefix: build(frontend)

  # Security updates only: tokenizers and transformers set the diff truncation,
  # so a routine bump would change what the frozen runs saw.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build(pipeline)

  - package-ecosystem: docker
    directories: [/deployments/docker, /deployments/preprocess]
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
    commit-message:
      prefix: build(deploy)
